[project]
name = "kafka-mcp"
version = "1.1.2"
description = "MCP server for securely operating and monitoring Apache Kafka clusters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.13.0",
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
kafka-mcp = "kafka_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
